# Môi trường phát triển. Các file database/*.sql chỉ chạy lần đầu (volume rỗng);
# reset dữ liệu: docker compose down -v && docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: flight_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
